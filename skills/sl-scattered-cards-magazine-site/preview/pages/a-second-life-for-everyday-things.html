<style>
:root {
  --bg: #F3F6F5; --surface: #FFFFFF; --fg: #172522; --muted: #40534F;
  --accent: #A12435; --accent-2: #21676A; --rule: #B9C8C3;
  --font-display: Rockwell, "Roboto Slab", "Courier New", ui-serif, serif; --font-body: "Helvetica Neue", Helvetica, Arial, ui-sans-serif, sans-serif;
  --display-weight: 700; --display-case: none; --tracking: 0;
  --radius: 24px; --radius-ctl: 24px; --border: 1px solid #B9C8C3; --shadow: 0 10px 30px -12px rgba(0,0,0,.25);
  --space: 1;
  --type-scale: 1;
}
:root { --on-accent: #ffffff; --border-strong: 1.5px solid color-mix(in srgb, var(--fg) 28%, transparent); }
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:calc(17px * var(--type-scale,1));line-height:1.6;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--font-display);font-weight:var(--display-weight);text-transform:var(--display-case);letter-spacing:var(--tracking);line-height:1.08;margin:0}
h1{font-size:clamp(2.3rem,5.4vw,4.4rem);text-wrap:balance}
h2{font-size:clamp(1.7rem,3.4vw,2.7rem);text-wrap:balance}
h3{font-size:1.15rem;line-height:1.3}
p{margin:0}
.wrap{width:min(1160px,100% - 40px);margin-inline:auto}
.section{padding-block:calc(88px * var(--space))}
.section + .section{border-top:1px solid color-mix(in srgb,var(--rule) 70%,transparent)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.eyebrow::before{content:"";width:18px;height:2px;background:currentColor}
.lede{font-size:1.15rem;color:var(--muted);max-width:56ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:var(--radius-ctl);font-weight:600;font-size:.98rem;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s ease,background .15s ease;font-family:inherit}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.btn-ghost{background:transparent;color:var(--fg);border:var(--border-strong)}
.sample-note{font-size:.78rem;color:var(--muted);margin-top:18px}
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid color-mix(in srgb,var(--rule) 70%,transparent)}
.nav .wrap{display:flex;align-items:center;gap:28px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.1rem;text-decoration:none;letter-spacing:var(--tracking)}
.brand-mark{width:28px;height:28px;border-radius:calc(var(--radius) * .5 + 3px);background:linear-gradient(135deg,var(--accent),var(--accent-2))}
.nav .btn{min-height:40px;padding:0 16px}
.block-label{width:min(1160px,100% - 40px);margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.block-stage{width:min(1220px,100% - 24px);margin-inline:auto;background:var(--bg);overflow:hidden}
.block-stage .section{padding-block:calc(72px * var(--space))}
@media (max-width:640px){.nav .btn{display:none}
.section{padding-block:calc(64px * var(--space))}
[class^="hv-"],[class*=" hv-"]{overflow:hidden;max-width:100%}
.brand{min-width:0;overflow-wrap:anywhere}
}
html,body{overflow-x:clip}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}
}
.block-stage .section h1{font-size:clamp(1.8rem,3.6vw,2.8rem)}
@keyframes tick{to{transform:translateX(-50%)}}
@keyframes caret{50%{opacity:0}}
@keyframes drift{to{background-position:380px 190px,-300px 420px}}
@keyframes float{to{transform:translate(18px,-22px) rotate(25deg)}}
@keyframes sheen{to{background-position:-150% 0}}
.img-slot{margin:0;position:relative;display:grid;place-items:center;align-content:center;gap:10px;min-height:180px;aspect-ratio:4/3;border-radius:var(--radius);border:1.5px dashed color-mix(in srgb,var(--fg) 30%,transparent);background:color-mix(in srgb,var(--accent) 7%,var(--surface));color:var(--muted);text-align:center;padding:16px;overflow:hidden}
.img-slot figcaption{font-size:.8rem;letter-spacing:.04em;max-width:26ch;color:var(--fg);opacity:.75}
.img-slot svg{color:var(--accent)}
.hv-hero-slot{aspect-ratio:4/3;min-height:320px}
.detail-page{display:grid;gap:18px;max-width:860px}
body{ background-image: repeating-radial-gradient(circle at 17% 32%, #B9C8C322 0 1px, transparent 1px 3px), repeating-radial-gradient(circle at 71% 64%, #B9C8C31c 0 1px, transparent 1px 4px); }

</style>
